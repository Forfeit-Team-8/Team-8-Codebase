<style>
  html, body { margin: 0; padding: 0; background: #1a1612; }
  body { font-family: 'Inter', -apple-system, system-ui, sans-serif; }
  * { box-sizing: border-box; }

  /* pixel-art rendering for any sprite */
  .pixel { image-rendering: pixelated; image-rendering: crisp-edges; }

  /* design tokens — outside courtroom (light-green earnest palette) */
  :root {
    --bg: #F2FBF4;
    --paper: #FFFFFF;
    --ink: #1F3A2A;
    --ink-2: #4A6655;
    --muted: #8AA092;
    --line: #E2EFE6;
    --primary: #2EB872;
    --primary-ink: #ffffff;
    --accent: #FFD166;
    --warm: #FF9A6C;
    --danger: #E05767;
    --chip: #E9F6EE;
  }

  /* pixel character blocks: each character is built from a CSS box-shadow
     pixel grid in pixel-characters.jsx. No SVG art. */
</style>
